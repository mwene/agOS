[package]
name = "agos-kernel"
version = "0.1.0"
edition = "2021"
description = "agOS (Agentic Operating System) – Cognitive Kernel"

[features]
default = []
z3-solver = ["dep:z3"]
wasm-sandbox = ["dep:wasmtime"]
embodiment = []
uri = []

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dashmap = "6"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5"
async-trait = "0.1"
z3 = { version = "0.7", optional = true }
wasmtime = { version = "45", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
opentelemetry = { version = "0.22", features = ["trace"] }
opentelemetry-otlp = { version = "0.15", features = ["trace"] }
opentelemetry_sdk = { version = "0.22", features = ["trace", "rt-tokio"] }
tracing-opentelemetry = "0.23"
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
wat = "1"
