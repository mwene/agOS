[package]
name = "agos-sign"
version = "0.1.0"
edition = "2021"
description = "CLI tool for signing .aapp agent packages"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
serde_json = "1"
rand = "0.8"
base64 = "0.22"
